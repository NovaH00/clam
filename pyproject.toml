[project]
name = "CLAM"
version = "0.1.1"
description = "CLAM lets you manage shell aliases directly from the command line without editing config files."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "nuitka>=4.0.8",
    "orjson>=3.11.8",
    "platformdirs>=4.9.6",
    "typer>=0.24.1",
    "zstandard>=0.25.0",
]
